<div class="home-container">
  <!-- Welcome Card -->
  <mat-card class="welcome-card">
    <mat-card-header>
      <mat-card-title>Welcome to Your Dashboard</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Hello, <strong>{{ username$ | async }}</strong>!</p>
      <p>Track your daily steps, water intake, and calorie balance to stay healthy!</p>
    </mat-card-content>
  </mat-card>

  <!-- Tracking Grid -->
  <div class="tracking-grid">
    <!-- Step Tracking -->
    <div class="tracking-column">
      <app-step-display></app-step-display>
      <app-step-input></app-step-input>
    </div>
    
    <!-- Calorie Tracking -->
    <div class="tracking-column">
      <app-calorie-display></app-calorie-display>
      <app-calorie-input></app-calorie-input>
    </div>
    
    <!-- Water Tracking -->
    <div class="tracking-column">
      <app-water-display></app-water-display>
      <app-water-intake></app-water-intake>
    </div> 

    <!-- Heart Tracking -->
    <div class="tracking-column">
      <app-heart-display #heartDisplay></app-heart-display>
      <app-heart-log (logged)="heartDisplay.load()"></app-heart-log>
    </div>

    <!-- Weight Tracking -->
    <div class="tracking-column">
      <app-weight-display #weightDisplay></app-weight-display>
      <app-weight-log (logged)="weightDisplay.loadLogs()"></app-weight-log>
    </div>

  </div>
</div>
