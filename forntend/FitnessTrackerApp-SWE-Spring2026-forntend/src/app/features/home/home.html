
<div class="home-container">
  <!-- Welcome Card -->
  <mat-card class="welcome-card">
    <mat-card-header>
      <mat-card-title>Welcome to Your Dashboard</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Hello, <strong>{{ username$ | async }}</strong>!</p>
      <p>Track your daily water intake and calorie balance to stay healthy!</p>
    </mat-card-content>
  </mat-card>

  <!-- Tracking Section -->
  <div class="tracking-grid">
    <!-- Calorie Tracking -->
    <div class="tracking-column">
      <app-calorie-display></app-calorie-display>
      <app-calorie-input></app-calorie-input>
    </div>
    
    <!-- Water Tracking -->
    <div class="tracking-column">
      <app-water-display></app-water-display>
      <app-water-intake></app-water-intake>
    </div>
    <div class="tracking-column">
     <app-weight-log></app-weight-log>
    </div>
  </div>
</div>
