
<div class="home-container">
  <!-- Welcome Card -->
  <mat-card class="welcome-card">
    <mat-card-content>
      <div class="welcome-shell">
        <p class="welcome-kicker">Fitness Dashboard</p>
        <h1 class="welcome-title">
          Welcome back,
          <span>{{ (username$ | async) || 'Athlete' }}</span>
        </h1>
        <p class="welcome-subtitle">
          Keep building momentum today. Log your calories, water intake, and weight to stay on track with your goals.
        </p>

        <div class="welcome-highlights" aria-label="dashboard highlights">
          <div class="highlight-pill">Hydration Tracking</div>
          <div class="highlight-pill">Calorie Balance</div>
          <div class="highlight-pill">Weight Progress</div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Tracking Section -->
  <div class="tracking-grid">
    <!-- Calorie Tracking -->
    <div class="tracking-column">
      <app-calorie-display></app-calorie-display>
      <app-calorie-input></app-calorie-input>
    </div>
    
    <!-- Water Tracking -->
    <div class="tracking-column">
      <app-water-display></app-water-display>
      <app-water-intake></app-water-intake>
    </div>
    <div class="tracking-column">
     <app-weight-log></app-weight-log>
    </div>
  </div>
</div>
