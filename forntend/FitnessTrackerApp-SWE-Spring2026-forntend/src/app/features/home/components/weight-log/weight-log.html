<mat-card class="weight-card">
  <mat-card-header>
    <mat-card-title>
      <mat-icon class="title-icon">scale</mat-icon>
      Log Weight
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="weight-form">
      <div class="unit-row">
        <mat-button-toggle-group [value]="unit" (change)="unit = $event.value" data-cy="weight-unit-toggle">
          <mat-button-toggle value="kg">kg</mat-button-toggle>
          <mat-button-toggle value="lbs">lbs</mat-button-toggle>
        </mat-button-toggle-group>
      </div>

      <div class="entry-row">
        <mat-form-field appearance="outline" class="weight-input">
          <mat-label>Weight</mat-label>
          <input matInput type="number" formControlName="weight" data-cy="weight-input"/>
          <span matTextSuffix>{{ unit }}</span>
          <mat-error *ngIf="form.get('weight')?.invalid && form.get('weight')?.touched">
            Enter a valid weight
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="loading || form.invalid"
          data-cy="log-weight-btn">
          {{ loading ? 'Logging...' : 'Log Weight' }}
        </button>
      </div>

      <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="message error" *ngIf="errorMessage" data-cy="modify-weight-error">{{ errorMessage }}</div>
    </form>

    <!-- Modify Most Recent -->
    <div class="modify-section">
      <button
        mat-stroked-button
        color="accent"
        class="modify-toggle-btn"
        (click)="toggleModifyForm()"
        matTooltip="Update your most recent weight entry">
        <mat-icon>{{ showModifyForm ? 'close' : 'edit' }}</mat-icon>
        {{ showModifyForm ? 'Cancel Correction' : 'Correct Recent' }}
      </button>

      <form *ngIf="showModifyForm" [formGroup]="modifyForm" (ngSubmit)="modifyMostRecent()" class="modify-form">
        <p class="modify-info">Update your most recent weight entry</p>

        <div class="modify-input-row">
          <mat-form-field appearance="outline" class="modify-input">
            <mat-label>New Weight</mat-label>
            <input matInput type="number" formControlName="weight" data-cy="modify-weight-input"/>
            <span matTextSuffix>{{ unit }}</span>
            <mat-error *ngIf="modifyForm.get('weight')?.invalid && modifyForm.get('weight')?.touched">
              Enter a valid weight
            </mat-error>
          </mat-form-field>

          <button
            mat-raised-button
            color="warn"
            type="submit"
            class="modify-btn"
            [disabled]="loading || modifyForm.invalid"
            data-cy="modify-weight-btn">
            <mat-icon>{{ loading ? 'sync' : 'check' }}</mat-icon>
            {{ loading ? 'Updating...' : 'Update' }}
          </button>
        </div>

        <div class="message error" *ngIf="modifyErrorMessage" data-cy="modify-weight-error">
          {{ modifyErrorMessage }}
        </div>
      </form>
    </div>
  </mat-card-content>
</mat-card>
